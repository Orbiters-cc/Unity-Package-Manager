name: Build Release

on: 
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          fetch-depth: 0
      - name: Check package version change
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def decide():
              if os.environ["EVENT_NAME"] == "workflow_dispatch":
                  return True, "Manual release requested."
              before = os.environ["BEFORE_SHA"]
              if not before or set(before) == {"0"}:
                  return False, "No previous branch revision to compare."
              if subprocess.run(["git", "cat-file", "-e", f"{before}^{{commit}}"],
                                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", before], check=True)
              previous = json.loads(git("show", f"{before}:package.json"))["version"]
              current = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
              if not isinstance(current, str) or not current:
                  raise ValueError("package.json version must be a nonempty string")
              subprocess.run(["git", "check-ref-format", f"refs/tags/{current}"], check=True)
              if current == previous:
                  return False, f"Package version is unchanged ({current})."
              if subprocess.run(["git", "show-ref", "--verify", "--quiet",
                                 f"refs/tags/{current}"]).returncode == 0:
                  return False, f"Version {current} already has a tag; use a new version or a manual release."
              return True, f"Package version changed from {previous} to {current}."

          should_release, reason = decide()
          print(reason)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_release={str(should_release).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(reason + "\n")
          PY


  # Validate Repository Configuration
  config:
    needs: release-check
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required repository variable has been created for the Package
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: "."
    if: needs.config.outputs.config_package == 'true'
    steps:

      # Checkout Local Repository (the token stays out of .git/config: later steps pass it explicitly)
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          persist-credentials: false

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      - name: Test Package Archive Policy
        working-directory: "${{ env.packagePath }}"
        run: python3 -B -m unittest discover -s ci -p 'test_*.py'

      # Both formats preserve the package's GUIDs; repository metadata and credentials are excluded.
      - name: Build Package File List
        working-directory: "${{ env.packagePath }}"
        run: python3 ci/build-package-file-list.py --output packageFiles --meta-output metaList

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -q "${{ github.workspace }}/${{ env.zipFile }}" -@ < packageFiles

      - name: Validate Package Zip Contents
        working-directory: "${{ env.packagePath }}"
        run: python3 ci/validate-package-archive.py "${{ github.workspace }}/${{ env.zipFile }}"

      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}
